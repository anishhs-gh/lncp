name: Release

# Manual trigger only. Run from the master branch after the release commit
# (CHANGELOG entry + reference/package.json version bump) has landed.
#
# Pipeline: validate → verify (tests + vectors) → npm dry-run (strict auth)
#           → npm publish (provenance) → git tag + GitHub release.
#
# The npm stages honor the publish-npm input, so a spec-only release can cut
# a tag + release without touching the registry. A real publish is always
# preceded by the same dry-run that CI runs on every push — by the time this
# workflow publishes, nothing about publishability is being tested for the
# first time.
#
# Release notes are AI-generated by ledger (@anishhs/ledger) from the commits
# and diffs since the previous tag; if generation fails for any reason, the
# curated CHANGELOG entry — whose existence `validate` already enforced — is
# used instead, so notes can never block a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0 or 1.1.0-beta.1) — must match reference/package.json and have a CHANGELOG entry"
        required: true
        type: string
      publish-npm:
        description: "Publish @lncp/core to npm"
        type: boolean
        default: true
      dist-tag:
        description: "npm dist-tag ('latest' for stable; 'beta'/'next' for a prerelease)"
        type: string
        default: latest

# One release at a time; never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tag + release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a non-master ref
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are cut from master only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version consistency
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1; }

          # A prerelease must never ship under the 'latest' dist-tag.
          if [[ "$VERSION" == *-* && "${{ inputs.publish-npm }}" == "true" && "${{ inputs.dist-tag }}" == "latest" ]]; then
            echo "::error::$VERSION is a prerelease — pick a dist-tag like 'beta' or 'next', not 'latest'."
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./reference/package.json').version")
          [[ "$PKG_VERSION" == "$VERSION" ]] \
            || { echo "::error::reference/package.json is $PKG_VERSION, not $VERSION"; exit 1; }

          grep -Fq "## [$VERSION]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"; exit 1; }

          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

  verify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - name: Library quality gates
        working-directory: reference
        run: |
          npm ci
          npm run check
          npm run build
      - name: Conformance vectors reproduce
        run: node vectors/generate.js | diff vectors/vectors.json -

  npm-dry-run:
    if: inputs.publish-npm
    needs: verify
    uses: ./.github/workflows/npm-dry-run.yml
    with:
      require-auth: true
    secrets: inherit

  npm-publish:
    needs: npm-dry-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance attestation
    defaults:
      run:
        working-directory: reference
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: reference/package-lock.json
      - run: npm ci
      # prepublishOnly re-runs check + build + verify-pack — the same quality
      # gate applies whether publishing from here or from a laptop.
      - run: npm publish --provenance --tag "${{ inputs.dist-tag }}"

  release:
    needs: [validate, verify, npm-dry-run, npm-publish]
    # Runs when the npm leg either succeeded or was deliberately skipped
    # (publish-npm: false) — but never when any stage failed.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.verify.result == 'success' &&
      (
        (inputs.publish-npm && needs.npm-publish.result == 'success') ||
        (!inputs.publish-npm && needs.npm-publish.result == 'skipped')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags — ledger derives the notes range from them

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # The guaranteed fallback: the CHANGELOG entry that `validate` already
      # proved exists. A release is never blocked by note generation.
      - name: Extract CHANGELOG entry (fallback notes)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/              { exit }
            found                          { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes-changelog.md"
          [[ -s "$RUNNER_TEMP/notes-changelog.md" ]] \
            || { echo "::error::Extracted CHANGELOG notes are empty"; exit 1; }

      # Primary notes: ledger (https://github.com/anishhs-gh/ledger), run from
      # the live npm package. It reads the commits AND diffs for the range
      # (previous tag → HEAD; root → HEAD on the first release) and writes
      # audience-tailored notes. Provider is Bedrock via the BEDROCK_API_KEY
      # secret (optional vars: LEDGER_MODEL, AWS_REGION). Any failure — missing
      # key, provider outage, empty output — falls back to the CHANGELOG entry.
      - name: Generate release notes with ledger
        env:
          LEDGER_PROVIDER: bedrock
          LEDGER_MODEL: ${{ vars.LEDGER_MODEL }} # optional; empty = provider default
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }} # optional; ledger defaults to us-east-1
        run: |
          set -uo pipefail
          notes="$RUNNER_TEMP/release-notes.md"

          fallback() {
            echo "::warning::$1 — using the CHANGELOG entry as release notes."
            cp "$RUNNER_TEMP/notes-changelog.md" "$notes"
          }

          if [ -z "${BEDROCK_API_KEY:-}" ]; then
            fallback "BEDROCK_API_KEY secret not set"
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            from="$prev"
            echo "Generating notes for ${from}..HEAD"
          else
            from="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "First release — generating notes for root (${from})..HEAD"
          fi

          if npx --yes @anishhs/ledger@1 generate \
               --from "$from" --to HEAD \
               --output-file "$notes" --quiet \
             && [ -s "$notes" ]; then
            echo "ledger notes generated."
          else
            fallback "ledger note generation failed"
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "LNCP $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $prerelease
