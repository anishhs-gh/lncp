version: 2
updates:
  # Keep GitHub Actions pinned versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Dev toolchain of the reference library (it has no runtime deps)
  - package-ecosystem: npm
    directory: /reference
    schedule:
      interval: monthly
    groups:
      dev-toolchain:
        patterns: ["*"]
